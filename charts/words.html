<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <title>English Words</title>
  </head>
  <body>
    <div id="container" style="width: 100%; height: 260px"></div>
    <script
      type="text/javascript"
      src="https://unpkg.com/@antv/g2plot@latest/dist/g2plot.min.js"
    ></script>
    <script>
      const { Line } = G2Plot;
      const data = [
    {时刻: 20250627,背词个数: 70},
    {时刻: 20250628,背词个数: 80},
    {时刻: 20250629,背词个数: 70},

      ];
      const linePlot = new Line("container", {
        data,
        xField: "时刻",
        yField: "背词个数",
        useDeferredLabel: true,
        legend: {
          position: "top",
        },
        smooth: true,
        animation: {
          appear: {
            animation: "wave-in",
            duration: 1000,
          },
        },
        slider: {
          start: 0,
          end: 1,
        },
        // area: {
        //   style: {
        //     fillOpacity: 0.15,
        //   },
        // },
      });

      linePlot.render();
    </script>
  </body>
</html>
<style>
  body {
    background-color: white;
    color: black;
  }

  @media (prefers-color-scheme: dark) {
    body {
      background-color: #22272e;
      color: white;
    }
  }
</style>
